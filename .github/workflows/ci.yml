name: CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/ElectronicHelper.Core.Tests --configuration Release

  android:
    name: Android release build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - run: dotnet workload install android
      # Signed with the debug key: this checks that the app builds, it does not produce a store upload.
      - run: dotnet build src/ElectronicHelper --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: electronic-helper-unsigned-check
          path: src/ElectronicHelper/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
